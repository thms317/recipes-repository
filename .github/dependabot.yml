version: 2
updates:
  # Version updates disabled. Alerts/security updates also disabled via API.
  - package-ecosystem: github-actions
    directory: .
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-deps:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: .
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
